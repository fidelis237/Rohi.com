<style>html,body{margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap">
<style>
/* Layout follows the client's reference: white header with dropdown nav, photo-style hero, About row, four department cards, dark "Why Choose" band, campus map panel, Apply Now cards, dark footer. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --mint:#F2FAF5; --mint2:#E7F6ED; --card:#FFFFFF;
  --ink:#20382E; --muted:#64776C; --head:#064E36;
  --g1:#087443; --g2:#087443; --g3:#8fd5a8; --hover:#056039; --on-g1:#FFFFFF;
  --line:#D7E9DD; --sky:#8fcdf0; --gold:#d9a520;
  --band:#064E36; --band2:#087443; --on-band:#FFFFFF;
  --shadow:0 16px 36px -22px rgba(8,116,67,.28);
  --display:"Outfit","Trebuchet MS",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --script:"Dancing Script","Brush Script MT",cursive;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;color:var(--head)}
p{margin:0}
a{color:inherit}
svg.i{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.w{max-width:1200px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
section{padding-block:56px}
.script{font-family:var(--script);font-weight:700;color:var(--g2)}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:0;cursor:pointer;font:600 .95rem var(--display);padding:.75rem 1.3rem;border-radius:999px;text-decoration:none;transition:transform .25s,box-shadow .25s,background .25s}
.btn.p{background:var(--g1);color:var(--on-g1);box-shadow:0 10px 22px -12px var(--g1)}
.btn.p:hover{background:var(--hover);transform:translateY(-3px);box-shadow:0 16px 26px -12px var(--g1)}
.btn.g{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--g1)}
.btn.g:hover{background:var(--mint);transform:translateY(-3px)}
.btn.sm{padding:.5rem 1rem;font-size:.85rem}
.btn svg{transition:transform .3s}
.hero .cta .btn{position:relative;overflow:hidden;isolation:isolate}
.hero .cta .btn::before{content:"";position:absolute;inset:0;z-index:-1;transform:translateX(-101%);transition:transform .45s cubic-bezier(.2,.7,.2,1);background:linear-gradient(90deg,var(--hover),var(--g1))}
.hero .cta .btn.g::before{background:var(--g1)}
.hero .cta .btn:hover::before{transform:none}
.hero .cta .btn:hover{transform:translateY(-4px) scale(1.04);box-shadow:0 18px 30px -12px rgba(8,116,67,.6)}
.hero .cta .btn.g:hover{color:#fff;background:transparent;box-shadow:inset 0 0 0 2px var(--g1),0 18px 30px -12px rgba(8,116,67,.5)}
.hero .cta .btn:hover svg{transform:translateX(4px)}
.hero .cta .btn:active{transform:translateY(-1px) scale(.98)}
.btn.wa{background:var(--g1);color:var(--on-g1)}
:focus-visible{outline:3px solid var(--g2);outline-offset:3px;border-radius:6px}
.sec-h{text-align:center;margin-bottom:2rem}
.sec-h h2{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:700}
.sec-h p{color:var(--muted)}
#prog{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:4px;width:0;background:linear-gradient(90deg,var(--g3),var(--g1));z-index:70}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:linear-gradient(90deg,#FFFFFF 0%,#D2F0DD 28%,#9EDDB6 62%,#5CC488 100%);box-shadow:0 10px 26px -16px rgba(8,116,67,.5);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:1.2rem;height:72px}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.brand svg{width:46px;height:50px;flex:none}
.brand b{display:block;font:800 1.45rem/1 var(--display);letter-spacing:.02em;color:var(--g1)}
.brand small{display:block;font:600 .55rem/1.15 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);max-width:150px}
nav{margin-left:auto;display:flex;gap:.1rem;align-items:center}
nav>a,.dd>button{font:600 .85rem var(--display);text-decoration:none;padding:.5rem .7rem;border-radius:8px;color:var(--head);background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:.25rem;border-bottom:2px solid transparent;transition:.2s}
nav>a:hover,.dd>button:hover,nav>a.on{color:var(--g1);border-bottom-color:var(--g1);border-radius:8px 8px 0 0}
.dd{position:relative}
.menu{position:absolute;top:100%;left:0;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.4rem;box-shadow:var(--shadow);display:none;z-index:5}
.dd:hover .menu,.dd:focus-within .menu,.dd.open .menu{display:block}
.menu a{display:block;padding:.55rem .8rem;border-radius:9px;font:500 .9rem var(--display);text-decoration:none;cursor:pointer}
.menu a:hover{background:var(--mint2);color:var(--g1)}
.pill{background:var(--g1);color:var(--on-g1);font:600 .78rem var(--display);padding:.55rem 1rem;border-radius:999px;display:inline-flex;gap:.45rem;align-items:center;white-space:nowrap}
.lang{border:2px solid var(--g1);background:transparent;color:var(--ink);font:700 .75rem var(--display);padding:.3rem .65rem;border-radius:999px;cursor:pointer;letter-spacing:.06em}
.lang:hover{background:var(--hover);color:var(--on-g1)}
#burger{display:none;border:0;background:var(--g1);width:42px;height:42px;border-radius:12px;cursor:pointer;color:var(--on-g1);font-size:1.2rem;margin-left:auto}
@media(max-width:1080px){.pill{display:none}}
@media(max-width:960px){
  #burger{display:block}
  nav{position:absolute;left:0;right:0;top:72px;flex-direction:column;align-items:stretch;background:linear-gradient(180deg,#E4F6EA,#BFE9CF);padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);display:none;margin:0;max-height:calc(100vh - 80px);overflow-y:auto}
  nav.open{display:flex}
  nav>a,.dd>button{width:100%;padding:.8rem .6rem;justify-content:space-between}
  .menu{position:static;display:none;box-shadow:none;border:0;padding:0 0 0 .8rem}
  .dd:hover .menu{display:none}.dd.open .menu{display:block}
  .lang{align-self:flex-start;margin:.4rem .6rem}
}
/* hero */
.hero{padding-block:34px 18px;background:radial-gradient(900px 420px at 80% 0,var(--mint2),transparent 70%)}
.hgrid{display:grid;grid-template-columns:.9fr 1.1fr;gap:1.5rem;align-items:center}
.wel{display:inline-flex;font:600 .78rem var(--display);padding:.4rem 1rem;border-radius:999px;border:1.5px solid var(--g2);color:var(--head);background:linear-gradient(90deg,#E7F6ED,#B9E8CC);box-shadow:0 8px 18px -8px rgba(8,116,67,.35)}
.hero h1{font-size:clamp(2.3rem,5vw,3.9rem);font-weight:800;color:var(--head);margin-block:1rem .2rem;line-height:1.05}
.hero h1 .script{color:var(--g1);display:block;font-size:1.12em;font-weight:700;line-height:1.05}
.tags{display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-block:1rem .8rem;font:600 .86rem var(--display)}
.tags span+span{padding-left:.9rem;border-left:2px solid var(--line)}
.hero p.lead{color:var(--muted);max-width:46ch}
.cta{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.4rem}
.stage{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:16/11;background:linear-gradient(#bfe6ff,#eaf8ff 70%);box-shadow:var(--shadow)}
.stage .bg{position:absolute;inset:0;width:100%;height:100%}
.stage .f{position:absolute;bottom:-2%;height:92%;width:auto;filter:drop-shadow(0 14px 14px rgba(0,0,0,.18))}
.stage .f1{left:22%;animation:bob 5s ease-in-out infinite}.stage .f2{left:46%;animation:bob 5s ease-in-out -2.5s infinite}
.stage .tag{position:absolute;right:5%;top:12%;font-size:clamp(1.3rem,3vw,2.2rem);line-height:1.05;transform:rotate(-8deg);text-align:left}
.sun{position:absolute;right:12%;top:6%;width:70px;height:70px;border-radius:50%;background:radial-gradient(#fff6c8,#ffe48a);animation:pulse 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@media(max-width:900px){.hgrid{grid-template-columns:1fr}}

.stage.photo{aspect-ratio:4/5;width:100%;max-width:440px;justify-self:center;background:none;overflow:visible;box-shadow:none;position:relative}
.stage.photo::before{content:"";position:absolute;inset:6% -5% -5% 7%;border-radius:34px;background:linear-gradient(150deg,var(--g3),var(--g1));transform:rotate(3deg);opacity:.9}
.stage.photo img{position:relative;width:100%;height:100%;object-fit:cover;object-position:50% 12%;border-radius:30px;display:block;box-shadow:var(--shadow);border:4px solid var(--card)}
.lgb{position:absolute;left:-4%;bottom:7%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:.5rem 1.1rem;box-shadow:var(--shadow);animation:bob 5s ease-in-out infinite}
.lgb .script{font-size:1.35rem;color:var(--g1)}
@media(max-width:900px){.stage.photo{max-width:380px;margin-right:auto}.lgb{left:2%}}

.hero{position:relative;overflow:hidden;min-height:0;padding-block:0;background:linear-gradient(135deg,#FFFFFF 0%,#F2FAF5 50%,#E7F6ED 100%)}
.hero>.w{position:relative;z-index:2}
.hgrid{grid-template-columns:minmax(0,560px);min-height:470px;padding-block:28px;align-content:center}
.hero-bg{position:absolute;top:0;right:max(2%,env(safe-area-inset-right,0px));bottom:0;width:50%;z-index:1;display:flex;align-items:center;justify-content:center;animation:fade 1.2s ease}
.hero-bg::before{content:"";position:absolute;right:0;bottom:0;width:100%;height:78%;background:radial-gradient(ellipse 62% 70% at 50% 100%,rgba(8,116,67,.14),rgba(143,213,168,.12) 55%,transparent 75%);pointer-events:none}
.hero-bg::after{display:none;content:"";position:absolute;left:50%;bottom:1.5%;transform:translateX(-47%);width:62%;height:5%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(6,78,54,.30),transparent 70%);filter:blur(5px)}
.hero-bg img{position:relative;z-index:1;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;display:block;border-radius:0;border:0;box-shadow:0 4px 10px rgba(8,116,67,.12),0 30px 50px -20px rgba(8,116,67,.4)}
.hero-bg .lgt{position:absolute;z-index:2;left:1%;bottom:14%;font-size:clamp(1.25rem,2.2vw,1.7rem);line-height:1.05;color:var(--g1);transform:rotate(-6deg);background:#fff;padding:.5rem .9rem;border-radius:16px;box-shadow:var(--shadow);text-align:left}
@media(max-width:900px){
  .hero{min-height:0}
  .hgrid{min-height:0;padding-bottom:calc(min(62vw,300px) + 22px)}
  .hero-bg{top:auto;left:0;right:0;width:100%;height:min(62vw,300px)}
  .hero-bg{align-items:flex-end;padding:0 16px 14px;box-sizing:border-box}
  .hero-bg img{width:100%;height:auto}
  .hero-bg::after{transform:translateX(-50%);width:70%}
  .hero-bg .lgt{left:auto;right:2%;top:auto;bottom:14%;font-size:1.2rem}
}
/* about */
.ab{display:grid;grid-template-columns:1fr 1.05fr .8fr;gap:1.6rem;align-items:center}
.abimg{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/11;background:linear-gradient(#bfe6ff,#eaf8ff);box-shadow:var(--shadow)}
.abimg>img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;display:block;transition:transform .7s}
.abimg:hover>img{transform:scale(1.05)}
.since{position:absolute;left:0;bottom:0;right:35%;padding:1rem 1.2rem;color:#fff;display:flex;gap:.7rem;align-items:center;background:linear-gradient(90deg,var(--band),transparent);font:600 .85rem/1.2 var(--display)}
.since b{display:block;font-size:1.15rem}
.since svg{width:34px;height:34px;color:#f3cf63}
.abt h2{font-size:1.8rem;display:flex;align-items:center;gap:.7rem}
.abt h2::after{content:"";height:2px;width:50px;background:var(--g2)}
.abt h3{font:600 1rem var(--display);color:var(--muted);margin-block:.2rem .7rem}
.abt p{color:var(--muted);font-size:.95rem;margin-bottom:.7rem}
.stats{display:flex;flex-direction:column;gap:.7rem}
.stat{display:flex;gap:.8rem;align-items:center;background:var(--mint);border:1px solid var(--line);border-radius:16px;padding:.8rem 1rem;transition:transform .3s}
.stat{opacity:0;transform:translateX(40px)}
.stats.in .stat{animation:statIn .7s cubic-bezier(.2,.7,.2,1) forwards}
.stats.in .stat:nth-child(2){animation-delay:.15s}.stats.in .stat:nth-child(3){animation-delay:.3s}.stats.in .stat:nth-child(4){animation-delay:.45s}
@keyframes statIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.stat{box-shadow:0 2px 6px rgba(8,116,67,.06),0 14px 26px -14px rgba(8,116,67,.28)}
.stat:hover{transform:translateX(-6px) scale(1.02);box-shadow:0 4px 10px rgba(8,116,67,.1),0 22px 34px -14px rgba(8,116,67,.4);background:var(--mint2)}
.stat .ci{transition:transform .5s,background .3s,color .3s}
.stat:hover .ci{transform:rotate(-12deg) scale(1.12);background:var(--g1);color:#fff}
.stats.in .stat .ci{animation:ciPop .6s ease .5s both}
@keyframes ciPop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.stat .ci{width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--g1);display:grid;place-items:center;flex:none;border:1px solid var(--line);font-size:1.3rem}
.stat b{display:block;font:700 .95rem var(--display)}.stat small{color:var(--muted);font-weight:600}
@media(max-width:980px){.ab{grid-template-columns:1fr}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
.tlw{margin-top:2rem}
.tl{position:relative;display:flex;flex-direction:column;gap:1rem;padding-left:2rem;max-width:760px;margin-inline:auto}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:3px;background:linear-gradient(var(--g3),var(--g1));border-radius:3px}
.tli{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.9rem 1.2rem}
.tli::before{content:"";position:absolute;left:calc(-2rem + 1px);top:1.1rem;width:15px;height:15px;border-radius:50%;background:var(--g1);border:3px solid var(--bg)}
.yr{font:800 1.3rem var(--display);color:var(--g1)}
.tli p{color:var(--muted);font-size:.95rem}
/* departments */
#depts{background:var(--mint)}
.dg{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem}
.dc{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .35s,box-shadow .35s;min-width:0}
.dc{box-shadow:0 2px 6px rgba(8,116,67,.08),0 22px 40px -14px rgba(8,116,67,.34)}
.dc:hover{transform:translateY(-8px);box-shadow:0 4px 10px rgba(8,116,67,.10),0 34px 56px -16px rgba(8,116,67,.42)}
.dimg{aspect-ratio:16/8;overflow:hidden}
.dimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.dc:hover .dimg img{transform:scale(1.07)}
.badge{width:44px;height:44px;border-radius:50%;background:var(--mint2);color:var(--g1);display:grid;place-items:center;margin:-22px 0 0 18px;border:3px solid var(--card);position:relative;font-size:1.25rem}
.db{padding:.4rem 1.1rem 1rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.db h3{font-size:1.15rem}
.db .sub{font:600 .75rem var(--display);color:var(--g2)}
.db p{font-size:.86rem;color:var(--muted)}
.db .btn{align-self:flex-start;margin-top:auto}
.db .trs{margin-bottom:.5rem}
.trs{list-style:none;margin:0;padding:0;columns:2;column-gap:.6rem;font-size:.72rem;color:var(--muted)}
.trs li{break-inside:avoid;padding-left:1.1rem;position:relative;margin-bottom:.2rem;line-height:1.3}
.trs li::before{content:"";position:absolute;left:0;top:.3em;width:.45rem;height:.45rem;border-right:2px solid var(--g1);border-bottom:2px solid var(--g1);transform:rotate(45deg) scale(.9)}
@media(max-width:1000px){.dg{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.dg{grid-template-columns:1fr}}
/* why */
.why{background:linear-gradient(110deg,var(--band),var(--g1));color:#fff;padding-block:32px;position:relative;overflow:hidden}

.tms{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
.tm{margin:0;background:#fff;color:var(--ink);border-radius:26px;display:grid;grid-template-columns:150px 1fr;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.08),0 28px 44px -20px rgba(0,0,0,.4);transition:transform .35s,box-shadow .35s}
.tm:hover{transform:translateY(-6px)}
.tph{background:var(--mint2);position:relative;overflow:hidden}
.tph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.tph .av{position:absolute;inset:0}
.tph .av{display:grid;place-items:center;color:var(--g3);background:linear-gradient(160deg,var(--mint2),#cdeedb)}
.tph .av svg{width:70%;height:auto}
.tb{padding:1rem 1.2rem;display:flex;flex-direction:column;gap:.5rem;position:relative}
.tb .qm{width:24px;height:24px;color:var(--g3)}
.tb blockquote{margin:0;font-size:.94rem;line-height:1.5;color:var(--ink)}
.tb figcaption{margin-top:auto;display:flex;flex-direction:column;gap:.1rem}
.tb figcaption b{font:700 1rem var(--display);color:var(--head)}
.tb figcaption span{color:var(--muted);font-size:.85rem}
.tb figcaption em{font-style:normal;color:var(--g1);font:600 .78rem var(--display);margin-top:.2rem}
@media(max-width:1000px){.tms{grid-template-columns:1fr}}
@media(max-width:480px){.tm{grid-template-columns:1fr}.tph{height:260px}.tph img{object-position:50% 12%}}
.wg{display:grid;grid-template-columns:1.8fr .9fr;gap:2rem;align-items:center;position:relative;z-index:1}
.why h2{font-size:1.7rem;color:#fff}.why .s{color:rgba(255,255,255,.88);margin-bottom:1.4rem}
.wi{display:grid;grid-template-columns:repeat(6,1fr);gap:.8rem;text-align:center}
.wi div{display:flex;flex-direction:column;align-items:center;gap:.6rem;font:600 .78rem/1.25 var(--display);transition:transform .3s}
.wi div:hover{transform:translateY(-6px)}
.wi .c{width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,255,255,.75);display:grid;place-items:center;font-size:1.6rem;background:rgba(255,255,255,.12);color:#fff}
.q{border-left:3px solid rgba(255,255,255,.55);padding-left:1.4rem}
.q .script{color:#fff;font-size:1.5rem;line-height:1.25}
.q small{display:block;margin-top:.6rem;color:rgba(255,255,255,.85)}
@media(max-width:1000px){.wg{grid-template-columns:1fr}.wi{grid-template-columns:repeat(3,1fr)}.q{border-left:0;padding-left:0}}
@media(max-width:520px){.wi{grid-template-columns:repeat(2,1fr)}}
/* campuses */
.cg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem;align-items:stretch;max-width:1100px;margin-inline:auto}
.cg>*,.cl>*{width:100%;min-width:0}
.cl{display:contents}
.cg .cc:not(:has(.cimg)),.cg .gd{justify-content:center}
.cg .cc,.cg .cc.on,.cg .gd{box-shadow:0 2px 6px rgba(8,116,67,.08),0 22px 40px -14px rgba(8,116,67,.34);transition:transform .35s,box-shadow .35s,border-color .35s}

  if((el=e.target.closest("[data-gtab]"))){openGuide(+el.getAttribute("data-gtab"));return;}
  if((el=e.target.closest("[data-guide]"))){e.preventDefault();$("#nav").classList.remove("open");openGuide(curGuide);return;}
  if((el=e.target.closest("[data-dept]"))){e.preventDefault();$("#nav").classList.remove("open");openDept(+el.getAttribute("data-dept"));return;}
  if((el=e.target.closest("[data-form]"))){e.preventDefault();$("#nav").classList.remove("open");openForm(el.getAttribute("data-form"));return;}
  if((el=e.target.closest("[data-camp]"))){curCamp=+el.getAttribute("data-camp");rCampus();if(el.tagName==="A"){$("#nav").classList.remove("open");}return;}
  if((el=e.target.closest("[data-copy]"))){var v=el.getAttribute("data-copy"),b=el;try{navigator.clipboard.writeText(v).then(function(){b.textContent="✓";setTimeout(function(){b.textContent=t("copy");},1200);},function(){});}catch(x){}return;}
  if(e.target.closest("[data-close]")||e.target.classList.contains("modal")){closeAll();return;}
  if(e.target.closest("#gmore")){galOpen=!galOpen;rGallery();return;}
  if(e.target.closest("#more")){story=!story;$("#tlw").hidden=!story;$("#more").innerHTML=t(story?"less":"more")+ic("arrow");return;}
  if(e.target.closest("#story-btn")){story=true;rAbout();return;}
  if((el=e.target.closest(".dd>button"))){var dd=el.parentNode;var was=dd.classList.contains("open");document.querySelectorAll(".dd").forEach(function(x){x.classList.remove("open");});if(!was)dd.classList.add("open");return;}
  if(e.target.closest("#lang")){lang=lang==="en"?"fr":"en";try{localStorage.setItem("rohi-lang",lang);}catch(x){}renderAll();return;}
  if(e.target.closest("nav a[href]")){$("#nav").classList.remove("open");$("#burger").setAttribute("aria-expanded","false");}
  if(!e.target.closest(".dd")) document.querySelectorAll(".dd").forEach(function(x){x.classList.remove("open");});
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeAll();});
$("#burger").addEventListener("click",function(){var o=$("#nav").classList.toggle("open");this.setAttribute("aria-expanded",o);});
$("#tb-enrol").addEventListener("click",function(){mode="enrol";rForm();});
$("#tb-teach").addEventListener("click",function(){mode="teach";rForm();});
$("#form").addEventListener("submit",submitForm);

var topb=$("#top");
function onScroll(){var h=document.documentElement,max=h.scrollHeight-h.clientHeight;$("#prog").style.width=(max>0?(h.scrollTop/max*100):0)+"%";topb.classList.toggle("show",h.scrollTop>600);}
addEventListener("scroll",onScroll,{passive:true});onScroll();
topb.addEventListener("click",function(){scrollTo({top:0,behavior:"smooth"});});
var io=null;
function observe(){
  if(!("IntersectionObserver" in window)) return;
  if(!io) io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});},{threshold:.08});
  document.querySelectorAll(".rv:not(.in)").forEach(function(el){io.observe(el);});
}
if("IntersectionObserver" in window){
  var so=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){var id=en.target.id;document.querySelectorAll("nav>a[href]").forEach(function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+(id==="why"?"depts":id));});}});},{rootMargin:"-45% 0px -50% 0px"});
  ["home","about","depts","campus","gallery","apply","contact"].forEach(function(id){var s=document.getElementById(id);if(s)so.observe(s);});
}
renderAll();
})();
</script>
